name: Mirror to GitLab
on:
  push:
    branches: ['**']
    tags: ['**']
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to GitLab
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.gwdg.de/deepak.budha/msc-thesis-edge-gpu-anomaly-detection.git
          git push gitlab --all
          git push gitlab --tags
